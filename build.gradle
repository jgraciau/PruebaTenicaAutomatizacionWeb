buildscript {
    ext.serenityCoreVersion = '3.3.0'
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath("net.serenity-bdd:serenity-gradle-plugin:$serenityCoreVersion")
        classpath "net.serenity-bdd:serenity-single-page-report:$serenityCoreVersion"
    }
}

plugins {
    id 'java'
    id 'idea'
    id 'net.serenity-bdd.serenity-gradle-plugin' version '2.4.34'
}

group = 'com.company.automation'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processTestResources {
    exclude '**/~$*'
}

ext {
    serenityVersion = '3.6.12'
    cucumberVersion = '7.11.2'
    junitVersion = '4.13.2'
}

dependencies {

    // Dependencias de automatización usadas por los escenarios
    implementation "net.serenity-bdd:serenity-core:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-junit:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-screenplay:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-screenplay-webdriver:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-cucumber:${serenityVersion}"
    implementation "io.cucumber:cucumber-java:${cucumberVersion}"
    implementation "io.cucumber:cucumber-junit:${cucumberVersion}"
    implementation "org.seleniumhq.selenium:selenium-java:4.18.1"
    implementation "io.github.bonigarcia:webdrivermanager:5.7.0"
    implementation "com.fasterxml.jackson.core:jackson-databind:2.17.0"
    implementation "org.apache.poi:poi:5.2.5"
    implementation "org.apache.poi:poi-ooxml:5.2.5"
    implementation "org.assertj:assertj-core:3.25.3"
    implementation "org.hamcrest:hamcrest:2.2"
    compileOnly "org.projectlombok:lombok:1.18.32"
    annotationProcessor "org.projectlombok:lombok:1.18.32"
    implementation "org.slf4j:slf4j-simple:2.0.12"
    testImplementation "junit:junit:${junitVersion}"
}

test {
    useJUnit()
    systemProperty 'file.encoding', 'UTF-8'

    def testSystemPropertyPrefixes = ['webdriver.', 'serenity.', 'cucumber.', 'headless.', 'environment.']
    systemProperties System.getProperties().findAll { key, value ->
        testSystemPropertyPrefixes.any { prefix -> key.toString().startsWith(prefix) }
    }

    testLogging {
        events "PASSED", "FAILED", "SKIPPED"
    }
}

tasks.register('smokeTest', Test) {
    group = 'verification'
    description = 'Ejecuta únicamente escenarios no destructivos etiquetados como Smoke'
    useJUnit()
    filter { includeTestsMatching 'runners.RunnerTest' }
    systemProperty 'cucumber.filter.tags', '@Smoke and not @Destructive'
}

tasks.register('dryRun', Test) {
    group = 'verification'
    description = 'Valida que todos los steps Gherkin estén implementados sin abrir navegador'
    useJUnit()
    filter { includeTestsMatching 'runners.RunnerTest' }
    systemProperty 'cucumber.execution.dry-run', 'true'
}

serenity {
    reports = ["single-page-html"]
}